[project]
name = "agentic-puzzle-solver"
version = "1.0.0"
description = "Agentic Advent of Code solver backend (FastAPI, Microsoft Foundry, ACA Dynamic Sessions)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "azure-identity>=1.17",
    "beautifulsoup4>=4.12",
    "structlog>=24.1",
    "sse-starlette>=2.1",
    "aiohttp>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live_azure: requires real Microsoft Foundry deployments and a Dynamic Sessions pool (opt-in)",
    "live_aoc: requires a real Advent of Code session; never submits (opt-in)",
]
addopts = "-m 'not live_azure and not live_aoc'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "ASYNC109"]
